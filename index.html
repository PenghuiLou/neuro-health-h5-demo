<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F8FA" />
<meta name="description" content="脑安健康管理 H5 演示（模拟数据，不作为医疗判断依据）" />
<title>脑安 · 健康管理（演示版）</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <!-- 手机外壳：桌面浏览器下居中显示 390px 宽的手机预览，移动端全屏 -->
  <div class="phone-shell">
    <div class="phone-frame">
      <div class="status-bar" aria-hidden="true">
        <span class="status-left">9:41</span>
        <span class="status-right">
          <span class="dot-bars"><i></i><i></i><i></i><i></i></span>
          <span class="wifi-mark"></span>
          <span class="battery-mark"><b></b></span>
        </span>
      </div>

      <!-- 页面容器：所有一级页面与二级页面都渲染在这里 -->
      <main id="view-root" class="view-root" tabindex="-1"></main>

      <!-- 底部一级 Tab -->
      <nav id="tabbar" class="tabbar" aria-label="主导航"></nav>
    </div>
  </div>

  <!-- 底部抽屉 / 弹窗挂载点 -->
  <div id="overlay-root"></div>
  <!-- 轻提示挂载点 -->
  <div id="toast-root" class="toast-root"></div>

  <script src="js/mock-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/components/ai-insight-sheet.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/metric-detail.js"></script>
  <script src="js/pages/ai-doctor.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
